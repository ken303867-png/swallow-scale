name: Migrate swallow-scale
on:
  push:
    paths:
      - '.github/workflows/migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
      - name: Copy scale PWA from legacy repository
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/ken303867-png/a/main"
          curl -fsSL "$BASE/scale/index.html" -o index.html
          curl -fsSL "$BASE/scale/manifest.webmanifest" -o manifest.webmanifest
          curl -fsSL "$BASE/scale/sw.js" -o sw.js
          curl -fsSL "$BASE/scale/icon.svg" -o icon.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8').replace('dysphagia-scale-pwa-v1','swallow-scale-v1')
          p.write_text(s,encoding='utf-8')
          PY
          cat > README.md <<'EOF'
          # swallow-scale
          DSS・摂食嚥下能力グレード・FILS・FOISを学ぶ評価尺度50問PWA。
          旧 `ken303867-png/a/scale/` から独立したリポジトリである。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icon.svg README.md
          git commit -m "Migrate swallow-scale PWA from legacy repository"
          git push origin HEAD:main
